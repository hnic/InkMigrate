name: CI

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']

# 本工作流只需读代码 + 跑测试，按最小权限声明 GITHUB_TOKEN
permissions:
  contents: read

# 同一分支的新推送取消进行中的旧运行，避免过期运行抢占 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由 package.json 的 packageManager 字段统一管理（Corepack），避免重复指定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard JSON-RPC stdout channel
        run: node scripts/check-no-stdout-log.mjs

      - name: Build core + protocol + testkit (for downstream imports)
        run: |
          pnpm --filter @inkmigrate/protocol build
          pnpm --filter @inkmigrate/core build
          pnpm --filter @inkmigrate/testkit build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build all
        run: pnpm -r run build

      - name: CLI smoke test
        run: |
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js --version
