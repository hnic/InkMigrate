name: CI

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']

# 本工作流只需读代码 + 跑测试，按最小权限声明 GITHUB_TOKEN
permissions:
  contents: read

# 同一分支的新推送取消进行中的旧运行，避免过期运行抢占 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由 package.json 的 packageManager 字段统一管理（Corepack），避免重复指定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard JSON-RPC stdout channel
        run: node scripts/check-no-stdout-log.mjs

      - name: Build workspace (topological, for downstream imports)
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Generate test fixtures
        # evernote 的 .enex fixtures 被 .gitignore 排除（PRD §24.4：脚本确定性生成、不入库），
        # fresh clone/CI 必须先生成再跑测试，否则 ENOENT（见 .gitignore *.enex 注释）
        run: pnpm -r run gen:fixtures

      - name: Test
        run: pnpm -r run test

      - name: CLI smoke test
        # shell: bash——windows-latest 默认 pwsh，多行脚本的管道/错误语义与
        # bash 不同；三条矩阵腿统一用 bash（GH Windows runner 预装）
        shell: bash
        run: |
          node apps/cli/dist/index.js --help
          node apps/cli/dist/index.js --version
