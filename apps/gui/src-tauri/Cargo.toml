[package]
name = "inkmigrate-gui"
version = "1.0.0"
edition = "2021"

[lib]
name = "inkmigrate_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 按实际使用收窄 tokio 特性（io/process/sync/time/rt），避免引入无关子系统
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "sync", "time"] }
