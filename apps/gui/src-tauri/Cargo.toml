[package]
name = "inkmigrate-gui"
version = "1.0.0"
edition = "2021"
# MSRV 下限锚点：让过旧工具链得到 cargo 的明确报错（tauri 2.x 依赖实际可能要求更高）
rust-version = "1.77.2"
# 应用 crate，不发布到 crates.io
publish = false

[lib]
name = "inkmigrate_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 声明本 crate 直接使用的 tokio 特性（spawn/io/process/sync/time）；
# 注意 tauri 会传递启用更多 tokio 特性，此列表不缩小实际编译集
tokio = { version = "1", features = ["rt", "io-util", "process", "sync", "time"] }
